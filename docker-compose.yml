services:
  db:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    ports:
      - ${DB_PORT}:5432
    volumes:
      - my_pgdata:/var/lib/postgresql/data/18/main

  db-test:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres_test
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'postgres_test']
      interval: 2s
      retries: 15
    ports:
      - ${DB_TEST_PORT}:5432
    volumes:
      - my_pgdata_test:/var/lib/postgresql/data/18/main

volumes:
  my_pgdata:
  my_pgdata_test:
